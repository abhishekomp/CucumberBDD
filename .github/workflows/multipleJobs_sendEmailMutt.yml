# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Multiple Jobs Send Email
#
# PURPOSE  : Demonstrates multi-job workflows with job dependencies and
#            inter-job output passing.  Concepts covered:
#            • Two jobs: 'build' (runs tests) and 'notify' (sends email)
#            • 'needs: build' – 'notify' waits for 'build' to complete
#            • 'if: always()' on 'notify' – runs regardless of build outcome
#            • Job outputs – passing data (e.g. test result) from one job
#              to another via the outputs / $GITHUB_OUTPUT mechanism
#            • needs.<job>.result – reading the conclusion of a previous job
#
# TRIGGER  : workflow_dispatch with ordernumber and email inputs.
# ─────────────────────────────────────────────────────────────────────────────

name: Multiple Jobs Send Email

on:
  workflow_dispatch:
    inputs:
      ordernumber:
        description: 'Order number to process'
        required: true
        default: ''
      email:
        description: 'Recipient email address for the notification'
        required: true

jobs:

  # ── Job 1: build ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    # Declare outputs that other jobs can read via needs.build.outputs.<name>
    outputs:
      jobresult: ${{ steps.captureresult.outputs.jobresult }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      - name: List workspace root
        run: ls -a

      - name: List target directory contents
        run: |
          cd target
          ls -a

      - name: Echo client payload example-key
        run: 'echo "Event text: ${{ github.event.client_payload.example-key }}"'

      - name: Run Cucumber @P2 tests
        env:
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEST_ORDERNUM: ${{ github.event.inputs.ordernumber }}
        run: >
          mvn test -Dtest=TestRunner
          -Dcucumber.filter.tags=@P2

      # ── Capture failure result ──────────────────────────────────────────────
      # This step only runs when a previous step in this job failed.
      # It uses $GITHUB_OUTPUT (the modern replacement for the deprecated
      # set-output command) to expose a value to downstream jobs.
      # Syntax:  echo "<key>=<value>" >> $GITHUB_OUTPUT
      - name: Capture failure flag
        id: captureresult
        if: ${{ failure() }}
        run: echo "jobresult=Failed" >> $GITHUB_OUTPUT

  # ── Job 2: notify ───────────────────────────────────────────────────────────
  notify:
    # This job depends on 'build'; it will not start until 'build' finishes.
    needs: build
    # 'always()' means this job runs whether 'build' succeeded or failed.
    if: always()
    runs-on: ubuntu-latest

    steps:

      # ── Read the build job's conclusion ──────────────────────────────────────
      # needs.<job-id>.result contains: success | failure | cancelled | skipped
      # needs.<job-id>.outputs.<name> reads values set via $GITHUB_OUTPUT.
      - name: Print build job result
        run: |
          echo "Build job result:  ${{ needs.build.result }}"
          echo "Captured output:   ${{ needs.build.outputs.jobresult }}"

      - name: Install mutt
        run: sudo apt update && sudo apt install -y mutt

      - name: Configure mutt
        run: |
          cat << EOF > ~/.muttrc
          set smtp_url = "smtps://abhishek777@smtp.gmail.com"
          set smtp_pass = ${{ secrets.EMAIL_PASSWORD }}
          set from = ${{ secrets.EMAIL_USERNAME }}
          set realname = "Abhishek"
          EOF

      - name: Send result email via mutt
        env:
          REPODATA: "Repo: ${{ github.repository }} Workflow: ${{ github.workflow }} Run: ${{ github.run_number }}"
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo -e "Failed Job URL for Order: ${{ github.event.inputs.ordernumber }}\n${GITHUB_RUN_URL}\n\nRegards\nTest Team" | \
          mutt \
            -s "Job: ${REPODATA}" \
            -- "${{ github.event.inputs.email }}"
