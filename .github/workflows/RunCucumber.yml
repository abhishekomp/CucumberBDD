# ─────────────────────────────────────────────────────────────────────────────
# Workflow: RunCucumber
#
# PURPOSE  : Builds the project and runs the Cucumber test suite via Maven.
#            Demonstrates passing runtime environment variables to Java tests
#            and using GitHub context expressions inside a workflow step.
#
# TRIGGER  : workflow_dispatch → manual run from the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────

name: RunCucumber

on:
  workflow_dispatch:
    # Inputs let you supply parameters when triggering the workflow manually.
    # Here we allow the caller to specify a Cucumber tag filter.
    inputs:
      tags:
        description: 'Cucumber tag filter (e.g. @P1 or @P2)'
        required: false
        default: ''

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK setup ─────────────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ── Compile & package ─────────────────────────────────────────────────
      # Running 'package' first validates that the project compiles cleanly
      # before we attempt to run the tests in the next step.
      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      - name: List workspace root
        run: ls -a

      - name: List target directory contents
        run: |
          cd target
          ls -a

      # ── Run Cucumber tests ────────────────────────────────────────────────
      # '-Dtest=TestRunner' targets our specific JUnit runner class.
      # '--define cucumber.filter.tags' passes a tag expression so only
      # matching scenarios execute (empty string = run all scenarios).
      #
      # The 'env:' block injects environment variables that the Java code
      # reads via System.getenv().  JOB_ID_TRS receives the GitHub run ID
      # which uniquely identifies this workflow execution.
      #
      # '>' (YAML folded scalar) joins the continuation lines with spaces,
      # producing a single shell command – useful for long mvn invocations.
      - name: Run Cucumber tests
        env:
          JOB_ID_TRS: ${{ github.run_id }}
        run: >
          mvn test -Dtest=TestRunner
          -Dcucumber.filter.tags="${{ github.event.inputs.tags }}"
          --batch-mode --quiet

      # ── Print an env variable ─────────────────────────────────────────────
      # Each step has its own environment scope.  To share a variable across
      # steps you must either re-declare it in each step's 'env:' block or
      # use $GITHUB_ENV to export it (see GitHub docs: "Environment variables").
      - name: Print job run ID
        env:
          JOB_ID_TRS: ${{ github.run_id }}
        run: echo "Run ID is $JOB_ID_TRS"
