# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Github Actions API Example Two (repository_dispatch + Maven)
#
# PURPOSE  : Extends the basic repository_dispatch example by running the
#            Cucumber test suite and passing the full client_payload as an
#            environment variable to the Java test process.
#
# HOW TO TRIGGER (example curl with a JSON payload):
#   curl -X POST \
#     -H "Accept: application/vnd.github.v3+json" \
#     -H "Authorization: token <YOUR_PAT>" \
#     https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -d '{"event_type":"run-ping-maven",
#           "client_payload":{"icc":["SIM001","SIM002"],"order":"9988"}}'
#
# CONCEPTS:
#   • toJSON(github.event.client_payload) – serialises the whole payload
#     object back to a JSON string so the Java step can parse it with
#     org.json.JSONObject
#   • Setting GITHUB_RUN_URL as an env var so the Java code can log a
#     direct link to the CI run
#
# TRIGGER  : repository_dispatch with event type 'run-ping-maven'.
# ─────────────────────────────────────────────────────────────────────────────

name: Github Actions API Example Two

on:
  repository_dispatch:
    types: [run-ping-maven]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK setup ─────────────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ── Compile & package ─────────────────────────────────────────────────
      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      - name: List workspace root
        run: ls -a

      - name: List target directory contents
        run: |
          cd target
          ls -a

      # ── Echo a payload field ──────────────────────────────────────────────
      - name: Echo client payload example-key
        run: 'echo "Event text: ${{ github.event.client_payload.example-key }}"'

      # ── Run @P2 Cucumber tests with payload injected ──────────────────────
      # toJSON(...)  – converts a context object/value to a JSON string.
      # TEST_CLIENT_PAYLOAD receives the entire client_payload as a JSON
      # string; the Java step then parses it with org.json.JSONObject.
      # TEST_CLIENT_ICCID is a convenience variable containing just the
      # 'icc' array (also serialised to JSON by toJson).
      - name: Run Cucumber @P2 tests
        env:
          TEST_CLIENT_PAYLOAD: "${{ toJSON(github.event.client_payload) }}"
          TEST_CLIENT_ICCID: "${{ toJson(github.event.client_payload.icc) }}"
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: >
          mvn test -Dtest=TestRunner
          -Dcucumber.filter.tags=@P2
