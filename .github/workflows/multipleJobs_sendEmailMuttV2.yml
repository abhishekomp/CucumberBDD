# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Multiple Jobs Send Email V3 Try
#
# PURPOSE  : Simplified multi-job workflow focused on reading the result of
#            an upstream job and sending an email that includes that status.
#            Demonstrates:
#            • needs.<job>.result  – outcome string (success/failure/etc.)
#            • needs.<job>.conclusion – alias for result in expression context
#            • Minimal 'build' job with only shell steps (no Maven) for speed
#
# TRIGGER  : workflow_dispatch with default values pre-filled for convenience.
# ─────────────────────────────────────────────────────────────────────────────

name: Multiple Jobs Send Email V3 Try

on:
  workflow_dispatch:
    inputs:
      ordernumber:
        description: 'Order number to process'
        required: true
        default: '8899'
      email:
        description: 'Recipient email address for the notification'
        required: true
        default: 'abhishek777@gmail.com'

jobs:

  # ── Job 1: build ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      # These simple echo steps stand in for real test/build work.
      # In a real workflow you would run mvn test here.
      - name: Step one
        run: echo -e "Step Succeed"

      - name: Step two
        run: |
          echo "Line One"
          echo "Line Two"
          echo "Line Three"
          echo "Line Four"

  # ── Job 2: notify ───────────────────────────────────────────────────────────
  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:

      # needs.<job>.result returns the job-level conclusion string:
      #   success | failure | cancelled | skipped
      - name: Print build job status
        run: |
          echo "Status of 'build' job = ${{ needs.build.result }}"

      - name: Install mutt
        run: sudo apt update && sudo apt install -y mutt

      - name: Configure mutt
        run: |
          cat << EOF > ~/.muttrc
          set smtp_url = "smtps://abhishek777@smtp.gmail.com"
          set smtp_pass = ${{ secrets.EMAIL_PASSWORD }}
          set from = ${{ secrets.EMAIL_USERNAME }}
          set realname = "Abhishek"
          EOF

      # ── Send email ────────────────────────────────────────────────────────
      # BUG FIX: the original had two 'echo | mutt' pipes chained together.
      # The first echo's output was piped to the second echo (which ignores
      # stdin), so only the second message reached mutt.  Fixed to a single
      # echo that includes both the run URL and the job status.
      - name: Send result email via mutt
        env:
          REPODATA: "Repo: ${{ github.repository }} Workflow: ${{ github.workflow }} Run: ${{ github.run_number }}"
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo -e "Job URL for Order: ${{ github.event.inputs.ordernumber }}\n${GITHUB_RUN_URL}\nJob Status: ${{ needs.build.result }}\n\nRegards\nTest Team" | \
          mutt \
            -s "Job: ${REPODATA}" \
            -- "${{ github.event.inputs.email }}"
