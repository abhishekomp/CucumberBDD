# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Send Email Test 2 (mutt)
#
# PURPOSE  : Alternative email approach using the system 'mutt' mail client
#            instead of a third-party action.  Demonstrates:
#            • Installing system packages mid-workflow (apt)
#            • Writing a config file dynamically with a heredoc
#            • Sending email from shell with mutt
#            • Two workflow_dispatch inputs (ordernumber + recipient email)
#
# TRIGGER  : workflow_dispatch with required 'ordernumber' and 'email' inputs.
# ─────────────────────────────────────────────────────────────────────────────

name: Send Email Test 2

on:
  workflow_dispatch:
    inputs:
      ordernumber:
        description: 'Order number to process'
        required: true
        default: ''
      email:
        description: 'Recipient email address for the notification'
        required: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK setup ─────────────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ── Compile & package ─────────────────────────────────────────────────
      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      - name: List workspace root
        run: ls -a

      - name: List target directory contents
        run: |
          cd target
          ls -a

      # ── Echo payload field (learning demo) ────────────────────────────────
      - name: Echo client payload example-key
        run: 'echo "Event text: ${{ github.event.client_payload.example-key }}"'

      # ── Run @P2 Cucumber scenario ─────────────────────────────────────────
      - name: Run Cucumber @P2 tests
        env:
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEST_ORDERNUM: ${{ github.event.inputs.ordernumber }}
        run: >
          mvn test -Dtest=TestRunner
          -Dcucumber.filter.tags=@P2

      # ── Install mutt ──────────────────────────────────────────────────────
      # 'if: always()' guarantees the email steps run even after a test failure.
      # mutt is a lightweight CLI mail client available in Ubuntu's apt repos.
      - name: Install mutt
        if: always()
        run: sudo apt update && sudo apt install -y mutt

      # ── Configure mutt ────────────────────────────────────────────────────
      # A heredoc (cat << EOF) writes a multi-line string to ~/.muttrc.
      # mutt reads this file for SMTP settings on every invocation.
      # WARNING: avoid echoing secrets in run logs; they are masked but
      # it is good practice to reference them only where needed.
      - name: Configure mutt
        if: always()
        run: |
          cat << EOF > ~/.muttrc
          set smtp_url = "smtps://abhishek777@smtp.gmail.com"
          set smtp_pass = ${{ secrets.EMAIL_PASSWORD }}
          set from = ${{ secrets.EMAIL_USERNAME }}
          set realname = "Abhishek"
          EOF

      # ── Send email via mutt ───────────────────────────────────────────────
      # The pipe ( | ) feeds the echo output as the email body to mutt.
      # -s sets the subject, -- separates options from the recipient address.
      # ${{ github.event.inputs.email }} is the address entered at dispatch time.
      - name: Send result email via mutt
        if: always()
        env:
          REPODATA: "Repo: ${{ github.repository }} Workflow: ${{ github.workflow }} Run: ${{ github.run_number }}"
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo -e "Job URL for Order: ${{ github.event.inputs.ordernumber }}\n${GITHUB_RUN_URL}\n\nRegards\nTest Team" | \
          mutt \
            -s "Job: ${REPODATA}" \
            -- "${{ github.event.inputs.email }}"
