# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Github Actions Maven Build Example
#
# PURPOSE  : Demonstrates the most basic GitHub Actions workflow –
#            check out code, set up Java, compile & package with Maven,
#            then inspect the build artefacts.
#
# TRIGGER  : workflow_dispatch → run manually from the Actions tab on GitHub.
# ─────────────────────────────────────────────────────────────────────────────

name: Github Actions Maven Build Example

# 'on' defines what events trigger this workflow.
on:
  # workflow_dispatch means you can press "Run workflow" in the GitHub UI
  # without needing a code push or PR. Great for on-demand builds.
  workflow_dispatch:

# A workflow is made up of one or more jobs.
# By default jobs run in parallel; add 'needs:' to serialise them.
jobs:

  build:
    # The type of GitHub-hosted runner to use.
    # ubuntu-latest is free for public repos and suitable for most Java work.
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Get the source code ────────────────────────────────────────
      # actions/checkout clones your repository into the runner's workspace
      # ($GITHUB_WORKSPACE) so subsequent steps can access the files.
      # v4 is the current stable major version (supports shallow/full clones).
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install the JDK ────────────────────────────────────────────
      # actions/setup-java downloads and configures the requested JDK.
      # 'temurin' is the Eclipse Adoptium distribution – free, LTS, widely used.
      # Specifying 'cache: maven' automatically restores ~/.m2 between runs,
      # which can cut dependency-download time significantly.
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ── Step 3: Compile and package ────────────────────────────────────────
      # 'mvn -B package' runs all lifecycle phases up to 'package':
      #   validate → compile → test → package
      # -B (batch mode) suppresses interactive prompts and colours the output
      # for cleaner CI logs.
      # NOTE: this also runs unit/integration tests as part of the lifecycle.
      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      # ── Step 4: Sanity-check the workspace ─────────────────────────────────
      - name: List workspace root
        run: ls -a

      # ── Step 5: Inspect build output ───────────────────────────────────────
      # Maven places compiled classes, JARs, and test reports in ./target/
      - name: List target directory contents
        run: |
          cd target
          ls -a
