# ─────────────────────────────────────────────────────────────────────────────
# Workflow: Github Actions API Example (repository_dispatch)
#
# PURPOSE  : Shows how to trigger a workflow from an external system (e.g.
#            Postman, a shell script, or another service) using the GitHub
#            REST API's repository_dispatch endpoint.
#
# HOW TO TRIGGER (example curl):
#   curl -X POST \
#     -H "Accept: application/vnd.github.v3+json" \
#     -H "Authorization: token <YOUR_PAT>" \
#     https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -d '{"event_type":"run-ping","client_payload":{"example-key":"hello"}}'
#
# CONCEPTS:
#   • repository_dispatch – API-driven trigger; not visible in the Actions UI
#   • client_payload      – arbitrary JSON you send with the dispatch request;
#                           accessible as github.event.client_payload.*
#   • types               – lets you have multiple dispatches on one repo and
#                           route each to different workflows
#
# TRIGGER  : repository_dispatch with event type 'run-ping'.
# ─────────────────────────────────────────────────────────────────────────────

name: Github Actions API Example

on:
  repository_dispatch:
    types: [run-ping]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK setup ─────────────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ── Compile & package ─────────────────────────────────────────────────
      - name: Build and package with Maven
        run: mvn -B package --file pom.xml

      - name: List workspace root
        run: ls -a

      - name: List target directory contents
        run: |
          cd target
          ls -a

      # ── Read client_payload field ─────────────────────────────────────────
      # github.event.client_payload contains the JSON body sent with the
      # dispatch request.  Individual fields are accessed with dot notation.
      - name: Echo client payload example-key
        run: 'echo "Event text: ${{ github.event.client_payload.example-key }}"'
